<!doctype html>
<html lang="en" class="dark bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legion of Vocals | Anime Bangla Dubbing Portal</title>
    <!-- Dark theme baseline styling applied immediately to guarantee zero white flash -->
    <style>
      html, body {
        background-color: #020617 !important;
        color: #f8fafc !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      #lov-emergency-error {
        display: none;
        padding: 24px;
        max-width: 540px;
        margin: 40px auto;
        background: #0f172a;
        border: 1px solid rgba(239, 68, 68, 0.4);
        border-radius: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }
    </style>
    <script>
      // Global emergency uncaught error handler
      window.addEventListener('error', function(e) {
        console.error('[LOV Uncaught Error]:', e.error || e.message);
        var el = document.getElementById('lov-emergency-error');
        if (el) {
          el.style.display = 'block';
          var desc = document.getElementById('lov-error-desc');
          if (desc) desc.textContent = (e.error ? (e.error.stack || e.error.message) : e.message) || 'An unexpected error occurred while loading this view.';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[LOV Unhandled Rejection]:', e.reason);
      });
    </script>
    <!-- Cloudflare Turnstile Bot & Spam Protection -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  </head>
  <body class="bg-slate-950 text-white min-h-screen">
    <div id="root"></div>
    <div id="lov-emergency-error">
      <h2 style="color: #ef4444; margin-top: 0; font-size: 18px;">Display Notice</h2>
      <p style="color: #94a3b8; font-size: 13px; line-height: 1.5;">An unexpected issue occurred while rendering this section on your device:</p>
      <pre id="lov-error-desc" style="background: #020617; padding: 12px; border-radius: 8px; color: #fca5a5; font-size: 11px; overflow-x: auto; white-space: pre-wrap; font-family: monospace;"></pre>
      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button onclick="window.location.reload()" style="background: #06b6d4; color: #020617; font-weight: bold; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px;">Reload Page</button>
        <button onclick="try{localStorage.clear();}catch(e){} window.location.href='/'" style="background: #334155; color: #f8fafc; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px;">Reset Cache & Home</button>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
